# Local gate before every commit: lint and secret scan. Install once with:
#   uv run pre-commit install
# CI runs the same checks (.github/workflows/ci.yml), so skipping this locally only delays the
# failure, it does not avoid it.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans the staged changes for API keys, tokens and passwords (config: .gitleaks.toml).
      - id: gitleaks

  - repo: local
    hooks:
      # Runs the ruff version pinned in uv.lock, so local and CI results cannot differ.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true
