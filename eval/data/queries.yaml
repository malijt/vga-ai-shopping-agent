# Acceptance queries for the VGA AI Shopping Agent (plan Phase 4, feature 4.1.1).
#
# FROZEN BEFORE TUNING. These 10 inputs are fixed so that results cannot be rigged.
# Do not edit a query, add one or reorder after the first acceptance run. If one must
# change, record why in eval/results/ and re-run all 10.
#
# REWRITTEN ONCE on 2026-10-08, before any acceptance run had happened (plan assumption A23):
# dresses became a fifth category, and the business supplied 16 photos, most of them dresses,
# abayas or ethnic wear. The seven photo-based queries were rewritten around five of them; the
# three text queries (q06, q07, q08) are exactly as they were. The other 11 photos are in
# extra_queries.yaml, which is NOT part of the 10-query pass rule.
#
# AMENDED once more on 2026-10-08, also before any acceptance run: the optional field
# shopper_gender was added to the seven photo-based queries. The app asks "Who is this for?"
# when the request does not state a garment's gender (BRD Rule 8: a gender the model only
# guessed is not applied until the shopper confirms it), and a headless run has nobody to answer.
# Every one of those seven photos shows women's clothing, so the recorded answer is women. No
# input, text or note was changed, and the three text queries state their gender in their words.
#
# Contract (plan section 4, "Acceptance queries.yaml"). Each entry has:
#   id              unique, stable
#   type            product_photo | outfit_photo | text | photo_text
#   text            the shopper's words, or null for a photo-only query
#   image           path relative to the REPO ROOT, under eval/data/assets/, or null for text-only
#   shopper_gender  optional, women | men: what the shopper answers if the app asks "Who is this
#                   for?". Left out, the shopper gives no answer ("show both"). It is used only
#                   when some garment's gender was not stated; a gender the request states stands.
#   notes           what a labeller should expect (the labelling rules are in rubric.md)
#
# Mix required by the PRD "Acceptance test (10 queries)": 3 product photo, 2 outfit photo,
# 3 text, 2 photo + text. Every query is about tops, outerwear, bottoms, shoes or dresses
# (dresses, gowns, kaftans, abayas, kurtas and similar) only.
#
# The 5 photos live in eval/data/assets/private/ (gitignored) and were supplied by the user.
# See ASSETS.md for what each file shows. The two photo + text queries reuse two of the product
# photos (the gown and the jeans), so only 5 photos are needed in total.

queries:
  # ---- Product photo (3) ---------------------------------------------------------------
  - id: q01_product_gown
    type: product_photo
    text: null
    image: eval/data/assets/private/dress_burgundy_gown.png
    shopper_gender: women
    notes: >-
      A burgundy evening gown (dresses). The gown is NOT dark green, so q09 can ask for a
      colour change. Expected: one dresses item. Good match = a gown or long evening dress
      with a close colour and silhouette; a short dress, an abaya or a kaftan is a style miss.

  - id: q02_product_abaya
    type: product_photo
    text: null
    image: eval/data/assets/private/dress_pink_embellished_abaya.png
    shopper_gender: women
    notes: >-
      A pink embellished abaya (dresses). Expected: one dresses item whose search keywords hold
      the garment's own word "abaya", not "long dress". Good match = an abaya with a close
      colour and a similar amount of embellishment; a plain dress or a kaftan is a near miss
      at best. Few stores sell abayas, so a "few options" flag is a plausible, honest result.

  - id: q03_product_skinny_jeans
    type: product_photo
    text: null
    image: eval/data/assets/private/bottoms_light_blue_skinny_jeans.png
    shopper_gender: women
    notes: >-
      One pair of light blue skinny jeans (bottoms). Expected: one bottoms item. Good match =
      jeans of the same cut (skinny) with a close wash; wide-leg or straight jeans are not good
      matches.

  # ---- Outfit photo (2) ----------------------------------------------------------------
  - id: q04_outfit_palazzo_top
    type: outfit_photo
    text: null
    image: eval/data/assets/private/outfit_navy_print_palazzo_white_top.png
    shopper_gender: women
    notes: >-
      A person in navy printed palazzo trousers and a white top. Expected: one group for the
      top and one for the bottoms (palazzo trousers), plus shoes only if they are visible. Label
      the top 10 of each group separately (see rubric.md). The trousers are bottoms, not a dress.

  - id: q05_outfit_dress_heels
    type: outfit_photo
    text: null
    image: eval/data/assets/private/outfit_black_dress_heels.png
    shopper_gender: women
    notes: >-
      A person in a black dress and heels. A dress worn with shoes is two garments (PRD).
      Expected: two groups, dresses and shoes, each with its own result list. Label the top 10
      of each group separately (see rubric.md).

  # ---- Text (3) ------------------------------------------------------------------------
  - id: q06_text_blazer_budget
    type: text
    text: black oversized blazer for men under 400 AED
    image: null
    notes: >-
      Outerwear. Expected: colour black, gender men (stated, so applied), budget 400 AED.
      Premium and Luxury results may exceed 400 AED but must be labelled over budget.

  - id: q07_text_arabic_shirt
    type: text
    text: أريد قميصاً أبيض من القطن للرجال بأقل من 200 درهم
    image: null
    notes: >-
      Natural Arabic: "I want a white cotton shirt for men for less than 200 dirhams".
      Tops. Expected: English search keywords (white cotton shirt), gender men, budget 200
      AED. Tests Arabic understanding and the budget filter.

  - id: q08_text_wide_leg_jeans
    type: text
    text: women's high-waisted wide-leg jeans in light blue
    image: null
    notes: >-
      Bottoms, no budget. Expected: colour light blue, gender women (stated). With no
      budget, all four price ranges are filled by the quartile rule.

  # ---- Photo + text (2) ----------------------------------------------------------------
  - id: q09_photo_text_gown_green
    type: photo_text
    text: similar but dark green and cheaper
    image: eval/data/assets/private/dress_burgundy_gown.png
    shopper_gender: women
    notes: >-
      Reuses the q01 gown photo. The photo gives the look; the text changes the colour to
      dark green and asks for cheaper. No budget is given, so "cheaper" switches the request
      to the value-first mix (plan assumption A7). Good match = a gown or long evening dress
      in dark green.

  - id: q10_photo_text_jeans_black
    type: photo_text
    text: same cut but in black, under 250 AED
    image: eval/data/assets/private/bottoms_light_blue_skinny_jeans.png
    shopper_gender: women
    notes: >-
      Reuses the q03 photo. The photo gives the cut; the text changes the colour to black and
      sets a budget of 250 AED. Good match = same garment type and cut in black.
