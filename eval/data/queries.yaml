# Acceptance queries for the VGA AI Shopping Agent (plan Phase 4, feature 4.1.1).
#
# FROZEN BEFORE TUNING. These 10 inputs are fixed so that results cannot be rigged.
# Do not edit a query, add one or reorder after the first acceptance run. If one must
# change, record why in eval/results/ and re-run all 10.
#
# Contract (plan section 4, "Acceptance queries.yaml"). Each entry has exactly:
#   id     unique, stable
#   type   product_photo | outfit_photo | text | photo_text
#   text   the shopper's words, or null for a photo-only query
#   image  path relative to the REPO ROOT, under eval/data/assets/, or null for text-only
#   notes  what a labeller should expect (the labelling rules are in rubric.md)
#
# Mix required by the PRD "Acceptance test (10 queries)": 3 product photo, 2 outfit photo,
# 3 text, 2 photo + text. Every query is about tops, outerwear, bottoms or shoes only.
#
# The 5 photos live in eval/data/assets/private/ (gitignored) and are supplied by the user.
# See ASSETS.md for exactly what each file must show. The two photo + text queries reuse
# product photos, so only 5 photos are needed in total.

queries:
  # ---- Product photo (3) ---------------------------------------------------------------
  - id: q01_product_jacket
    type: product_photo
    text: null
    image: eval/data/assets/private/product_jacket.jpg
    notes: >-
      One jacket on a plain background (outerwear). The jacket is NOT dark brown, so q09
      can ask for a colour change. Expected: one outerwear item. Good match = a jacket of
      the same kind with a close colour and fit.

  - id: q02_product_sneakers
    type: product_photo
    text: null
    image: eval/data/assets/private/product_sneakers.jpg
    notes: >-
      One pair of low-top sneakers, side view (shoes). Expected: one shoes item. Good match
      = sneakers with a close colour and sole/upper style; boots, sandals and loafers are
      not good matches.

  - id: q03_product_jeans
    type: product_photo
    text: null
    image: eval/data/assets/private/product_jeans.jpg
    notes: >-
      One pair of jeans or trousers laid flat or on a hanger (bottoms), plain colour (for
      example mid-blue jeans). Expected: one bottoms item. Good match = same garment type
      with a close wash/colour and cut.

  # ---- Outfit photo (2) ----------------------------------------------------------------
  - id: q04_outfit_casual
    type: outfit_photo
    text: null
    image: eval/data/assets/private/outfit_casual.jpg
    notes: >-
      Mirror selfie or full-body photo with a visible top, bottoms and shoes (3 garments).
      Expected: three item groups (tops, bottoms, shoes), each with its own result list.
      Label the top 10 of each group separately (see rubric.md).

  - id: q05_outfit_layered
    type: outfit_photo
    text: null
    image: eval/data/assets/private/outfit_layered.jpg
    notes: >-
      Full-body photo with outerwear over a top, plus bottoms and shoes (4 garments, the
      most the app handles). Expected: four item groups. Tests the 4-garment cap and the
      time budget (about 4x the search pages).

  # ---- Text (3) ------------------------------------------------------------------------
  - id: q06_text_blazer_budget
    type: text
    text: black oversized blazer for men under 400 AED
    image: null
    notes: >-
      Outerwear. Expected: colour black, gender men (stated, so applied), budget 400 AED.
      Premium and Luxury results may exceed 400 AED but must be labelled over budget.

  - id: q07_text_arabic_shirt
    type: text
    text: أريد قميصاً أبيض من القطن للرجال بأقل من 200 درهم
    image: null
    notes: >-
      Natural Arabic: "I want a white cotton shirt for men for less than 200 dirhams".
      Tops. Expected: English search keywords (white cotton shirt), gender men, budget 200
      AED. Tests Arabic understanding and the budget filter.

  - id: q08_text_wide_leg_jeans
    type: text
    text: women's high-waisted wide-leg jeans in light blue
    image: null
    notes: >-
      Bottoms, no budget. Expected: colour light blue, gender women (stated). With no
      budget, all four price ranges are filled by the quartile rule.

  # ---- Photo + text (2) ----------------------------------------------------------------
  - id: q09_photo_text_jacket_brown
    type: photo_text
    text: similar but dark brown and cheaper
    image: eval/data/assets/private/product_jacket.jpg
    notes: >-
      Reuses the q01 jacket photo. The photo gives the look; the text changes the colour to
      dark brown and asks for cheaper. No budget is given, so "cheaper" switches the request
      to the value-first mix (plan assumption A7). Good match = a jacket of the same kind in
      dark brown.

  - id: q10_photo_text_jeans_black
    type: photo_text
    text: same cut but in black, under 250 AED
    image: eval/data/assets/private/product_jeans.jpg
    notes: >-
      Reuses the q03 photo. The photo gives the cut; the text changes the colour to black and
      sets a budget of 250 AED. Good match = same garment type and cut in black.
