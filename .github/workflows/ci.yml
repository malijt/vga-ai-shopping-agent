# Continuous integration: lint, types, tests, dependency audit and secret scan.
#
# Three separate jobs so each is its own required status check on `main`:
#   test        ruff, mypy, pytest (live tests are excluded by the pytest config)
#   pip-audit   known-vulnerability scan of every locked dependency, including the `ml` group
#   gitleaks    secret scan of the full git history
#
# Actions are pinned to full commit SHAs (the comment gives the tag) so a moved tag cannot change
# what runs. Nothing here needs a secret: live store and OpenAI tests never run in CI.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.9"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install (Python 3.12 from .python-version, runtime + dev groups)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Types
        run: uv run mypy src
      - name: Tests (no network, no live tests)
        run: uv run pytest

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install audit tool
        run: uv sync --locked
      # Audit the lock file, not just what is installed, so the optional `ml` group
      # (torch, open_clip) is covered without installing its ~1 GB of wheels.
      - name: Export every locked dependency
        run: uv export --locked --all-groups --no-emit-project --no-hashes -o audit-requirements.txt
      - name: Audit for known vulnerabilities
        run: uv run pip-audit -r audit-requirements.txt --no-deps --disable-pip

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the tip
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .
